name: Build Debian ARM64 Sanders

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq bc bison ca-certificates clang cpio debootstrap debian-archive-keyring e2fsprogs flex git gzip kmod libssl-dev llvm lld make mkbootimg mmdebstrap qemu-user-static tar android-sdk-libsparse-utils
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Build kernel
        run: |
          git clone --depth 1 --branch sanders https://github.com/me-ramoops/sanders-linux.git linux
          cd linux
          make ARCH=arm64 LLVM=1 defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/msm8953.config arch/arm64/configs/motorola-potter.config
          ./scripts/config --module CONFIG_DRM_PANEL_MOTOROLA_SANDERS_TIANMA_NT35596
          ./scripts/config --module CONFIG_DRM_PANEL_MOTOROLA_SANDERS_DJN_ILI7807D
          ./scripts/config --module CONFIG_DRM_MSM
          ./scripts/config --module CONFIG_TOUCHSCREEN_EDT_FT5X06
          ./scripts/config --module CONFIG_RMI4_CORE
          ./scripts/config --module CONFIG_RMI4_I2C
          ./scripts/config --enable CONFIG_RMI4_F11
          ./scripts/config --enable CONFIG_RMI4_F12
          ./scripts/config --enable CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --enable CONFIG_USB_F_RNDIS
          ./scripts/config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --enable CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --enable CONFIG_FB_SIMPLE
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_VT
          ./scripts/config --enable CONFIG_TRIM_UNUSED_KSYMS
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image.gz dtbs modules
          test -f arch/arm64/boot/dts/qcom/msm8953-motorola-sanders.dtb
          KVER="$(make ARCH=arm64 LLVM=1 -s kernelrelease)"
          echo "KVER=$KVER" >> "$GITHUB_ENV"

      - name: Build lk2nd
        run: |
          git clone --depth 1 --branch sanders https://github.com/me-ramoops/sanders-lk2nd.git lk2nd
          sudo apt-get install -y -qq gcc-arm-none-eabi device-tree-compiler
          make -C lk2nd -j"$(nproc)" TOOLCHAIN_PREFIX=arm-none-eabi- msm8953-secondary
          test -f lk2nd/build-msm8953-secondary/lk2nd.img

      - name: Create Debian ARM64 rootfs
        run: |
          sudo rm -rf rootfs
          sudo mmdebstrap --mode=root --arch=arm64 --variant=minbase \
            --include=alsa-ucm-conf,e2fsprogs,haveged,iproute2,kmod,network-manager,openssh-server,sudo,systemd,systemd-sysv,wpasupplicant \
            trixie "$GITHUB_WORKSPACE/rootfs" https://deb.debian.org/debian
          sudo test -f rootfs/etc/debian_version
          sudo rm -rf rootfs/var/cache/apt/archives/*.deb rootfs/var/lib/apt/lists/*

      - name: Configure rootfs
        run: |
          set -e
          echo sanders | sudo tee rootfs/etc/hostname >/dev/null
          printf '127.0.0.1 localhost\n127.0.1.1 sanders\n' | sudo tee rootfs/etc/hosts >/dev/null
          printf 'LABEL=debian-root / ext4 defaults 0 1\n' | sudo tee rootfs/etc/fstab >/dev/null
          printf '[keyfile]\nunmanaged-devices=interface-name:usb0\n' | sudo tee rootfs/etc/NetworkManager/conf.d/99-usb0-unmanaged.conf >/dev/null
          HASH=$(openssl passwd -6 sanders)
          sudo sed -i "s|^root:[^:]*:|root:$HASH:|" rootfs/etc/shadow
          sudo grep -q '^root:\$6\$' rootfs/etc/shadow
          sudo rm -f rootfs/etc/ssh/ssh_host_*_key*
          for t in rsa ecdsa ed25519; do sudo ssh-keygen -q -t "$t" -f "rootfs/etc/ssh/ssh_host_${t}_key" -N ''; done
          sudo test -f rootfs/etc/ssh/ssh_host_ed25519_key
          printf 'PermitRootLogin yes\n' | sudo tee -a rootfs/etc/ssh/sshd_config >/dev/null
          printf 'uninitialized\n' | sudo tee rootfs/etc/machine-id >/dev/null
          printf 'wcn36xx\n' | sudo tee rootfs/etc/modules-load.d/sanders.conf >/dev/null
          sudo tee rootfs/usr/local/sbin/usb-gadget.sh >/dev/null <<'SCRIPT'
          #!/bin/sh
          set -e
          G=/sys/kernel/config/usb_gadget/sanders
          mount -t configfs none /sys/kernel/config 2>/dev/null || true
          mkdir -p "$G/strings/0x409" "$G/functions/rndis.usb0" "$G/configs/c.1/strings/0x409"
          echo 0x05c6 > "$G/idVendor"
          echo 0x90db > "$G/idProduct"
          echo sanders > "$G/strings/0x409/manufacturer"
          echo sanders > "$G/strings/0x409/product"
          echo 42:61:6e:64:65:72 > "$G/functions/rndis.usb0/host_addr"
          echo 42:61:6e:64:65:73 > "$G/functions/rndis.usb0/dev_addr"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          ln -sfn "$G/functions/rndis.usb0" "$G/configs/c.1/"
          for i in $(seq 1 30); do [ -e /sys/class/udc/7000000.dwc3 ] && break; sleep 1; done
          echo 7000000.dwc3 > "$G/UDC"
          ip addr add 172.16.42.1/24 dev usb0 2>/dev/null || true
          ip link set usb0 up 2>/dev/null || true
          SCRIPT
          sudo chmod +x rootfs/usr/local/sbin/usb-gadget.sh
          sudo tee rootfs/etc/systemd/system/usb-gadget.service >/dev/null <<'UNIT'
          [Unit]
          Description=USB gadget networking
          After=sysinit.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/usb-gadget.sh
          RemainAfterExit=yes
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl --root="$GITHUB_WORKSPACE/rootfs" enable ssh NetworkManager usb-gadget

      - name: Install kernel modules and firmware
        run: |
          sudo make -C linux ARCH=arm64 LLVM=1 INSTALL_MOD_PATH="$GITHUB_WORKSPACE/rootfs" modules_install
          sudo rm -f rootfs/lib/modules/"$KVER"/source rootfs/lib/modules/"$KVER"/build
          git clone --depth 1 https://gitlab.com/sanders-revived/mainline-project/sanders-firmware.git firmware
          git clone --depth 1 --branch sanders https://gitlab.com/sanders-revived/mainline-project/sanders-alsa-ucm.git alsa-ucm
          sudo mkdir -p rootfs/lib/firmware/qcom/msm8953/motorola/sanders rootfs/lib/firmware/postmarketos rootfs/usr/share/alsa/ucm2/Motorola
          sudo cp -a alsa-ucm/ucm2/Motorola/sanders rootfs/usr/share/alsa/ucm2/Motorola/
          sudo cp firmware/modem/image/a506_zap.mdt firmware/modem/image/a506_zap.b0* rootfs/lib/firmware/qcom/msm8953/motorola/sanders/
          sudo cp firmware/modem/image/adsp.mdt firmware/modem/image/adsp.b?? firmware/modem/image/venus.mdt firmware/modem/image/venus.b?? firmware/modem/image/wcnss.mdt firmware/modem/image/wcnss.b?? firmware/modem/image/mba.mbn firmware/modem/image/modem.mdt firmware/modem/image/modem.b?? rootfs/lib/firmware/postmarketos/
          sudo cp firmware/wlan/WCNSS_qcom_wlan_nv.bin rootfs/lib/firmware/qcom/msm8953/motorola/sanders/
          for f in rootfs/lib/firmware/postmarketos/mba.mbn rootfs/lib/firmware/postmarketos/*.mdt rootfs/lib/firmware/postmarketos/*.b??; do [ -e "$f" ] || continue; sudo ln -sf "postmarketos/$(basename "$f")" "rootfs/lib/firmware/$(basename "$f")"; done
          sudo test -L rootfs/lib/firmware/modem.mdt && sudo test -L rootfs/lib/firmware/adsp.mdt && sudo test -L rootfs/lib/firmware/venus.mdt && sudo test -L rootfs/lib/firmware/wcnss.mdt
          sudo rm -f rootfs/usr/bin/qemu-aarch64-static rootfs/etc/resolv.conf

      - name: Build boot and rootfs images
        run: |
          cat linux/arch/arm64/boot/Image.gz linux/arch/arm64/boot/dts/qcom/msm8953-motorola-sanders.dtb > kernel-dtb
          printf '' | cpio -o -H newc > empty.cpio
          python3 tools/pack_qcdt.py linux/arch/arm64/boot/dts/qcom/msm8953-motorola-sanders.dtb dt.img
          python3 tools/mkbootimg.py --header_version 0 --kernel kernel-dtb --ramdisk empty.cpio --second dt.img --pagesize 2048 --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --second_offset 0x00f00000 --tags_offset 0x00000100 --cmdline 'console=tty0 root=LABEL=debian-root rootfstype=ext4 rw rootwait panic=10 fsck.repair=yes lpm_levels.sleep_disabled=1 msm.prefer_mdp5=true clk_ignore_unused pd_ignore_unused' -o boot.img
          test "$(stat -c%s boot.img)" -lt 15728640
          cp lk2nd/build-msm8953-secondary/lk2nd.img .
          sudo truncate -s 4G debian-sanders-rootfs.ext4
          sudo mkfs.ext4 -F -L debian-root -d rootfs debian-sanders-rootfs.ext4
          sudo tar --numeric-owner -czf debian-sanders-rootfs.tar.gz -C rootfs .
          sudo chown "$USER:$USER" boot.img lk2nd.img debian-sanders-rootfs.ext4 debian-sanders-rootfs.tar.gz
          img2simg debian-sanders-rootfs.ext4 debian-sanders-system-sparse.img
          test -f debian-sanders-system-sparse.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sanders-debian
          path: |
            boot.img
            lk2nd.img
            debian-sanders-rootfs.ext4
            debian-sanders-rootfs.tar.gz
            debian-sanders-system-sparse.img
          if-no-files-found: error

      - name: Telegram boot files
        if: always()
        run: |
          for f in boot.img lk2nd.img; do
            [ -f "$f" ] && curl -s -F chat_id="${{ secrets.CHAT_ID }}" \
              -F document=@"$f" "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument" >/dev/null
          done
          echo TG-DONE
